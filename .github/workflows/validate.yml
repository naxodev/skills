name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: skills/pr-walkthrough/scripts
      - run: npm install --global skills-ref@0.1.5 @anthropic-ai/claude-code@2.1.233
      - run: bun run check
